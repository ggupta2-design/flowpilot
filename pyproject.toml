[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowpilot"
version = "0.5.0"
description = "A lightweight task automation CLI"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
flowpilot = "flowpilot.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
